name: gmaps-scraping

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmaps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gmaps}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmaps}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    restart: unless-stopped
    command: ["-web", "-addr", ":8080", "-data-folder", "/gmapsdata"]
    shm_size: "2gb"
    volumes:
      - scraper_data:/gmapsdata

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GMAPS_SCRAPER_BASE_URL: http://gmaps-scraper:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmaps-scraper:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          - gmaps-api

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: .env
    environment:
      GMAPS_SCRAPER_BASE_URL: http://gmaps-scraper:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmaps-scraper:
        condition: service_started

volumes:
  pgdata:
  scraper_data:
